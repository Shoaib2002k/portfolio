<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Mohammed Shoaib S</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!-- Back to Home Button - Top Left -->
<a href="index.html" class="back-home-btn">
    <i class="fas fa-arrow-left"></i>
    <span>Back to Home</span>
</a>
    <div id="navigation-container"></div>

    <section class="section" style="padding-top: 8rem;">
        <div class="container-custom">
            <!-- Dashboard Header -->
            <div class="flex justify-between items-center mb-8 flex-wrap gap-4">
                <div>
                    <h2 class="text-3xl font-bold text-gray-800">Dashboard</h2>
                    <p class="text-gray-500 mt-1">Manage your projects and blog posts</p>
                </div>
                <div class="flex gap-3">
                    <button onclick="showAddProjectForm()" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Add Project
                    </button>
                    <button onclick="showAddBlogForm()" class="btn btn-outline">
                        <i class="fas fa-plus"></i> Add Blog Post
                    </button>
                </div>
            </div>

            <!-- Stats Cards -->
            <div class="grid md:grid-cols-4 gap-6 mb-8">
                <div class="stat-card">
                    <div class="flex items-center justify-between">
                        <div>
                            <span class="stat-number" id="totalProjects">0</span>
                            <span class="stat-label">Total Projects</span>
                        </div>
                        <i class="fas fa-code text-4xl text-green-200"></i>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="flex items-center justify-between">
                        <div>
                            <span class="stat-number" id="totalBlogs">0</span>
                            <span class="stat-label">Blog Posts</span>
                        </div>
                        <i class="fas fa-blog text-4xl text-green-200"></i>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="flex items-center justify-between">
                        <div>
                            <span class="stat-number" id="totalViews">0</span>
                            <span class="stat-label">Total Views</span>
                        </div>
                        <i class="fas fa-eye text-4xl text-green-200"></i>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="flex items-center justify-between">
                        <div>
                            <span class="stat-number" id="totalMessages">0</span>
                            <span class="stat-label">Messages</span>
                        </div>
                        <i class="fas fa-envelope text-4xl text-green-200"></i>
                    </div>
                </div>
            </div>

            <!-- Add Project Form (Hidden by default) -->
            <div id="addProjectForm" class="bg-white rounded-2xl border border-gray-100 p-6 mb-8 hidden">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-gray-800">Add New Project</h3>
                    <button onclick="hideAddProjectForm()" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                <form id="projectForm">
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="form-label">Project Title *</label>
                            <input type="text" id="projectTitle" class="form-control" placeholder="e.g., Alumni Portal" required>
                        </div>
                        <div>
                            <label class="form-label">Tech Stack (comma separated) *</label>
                            <input type="text" id="projectTech" class="form-control" placeholder="e.g., HTML, CSS, JavaScript, MySQL" required>
                        </div>
                        <div class="md:col-span-2">
                            <label class="form-label">Short Description *</label>
                            <textarea id="projectDesc" rows="2" class="form-control" placeholder="Brief description of the project" required></textarea>
                        </div>
                        <div class="md:col-span-2">
                            <label class="form-label">Full Description</label>
                            <textarea id="projectFullDesc" rows="3" class="form-control" placeholder="Detailed project description"></textarea>
                        </div>
                        <div>
                            <label class="form-label">GitHub Link</label>
                            <input type="url" id="projectGithub" class="form-control" placeholder="https://github.com/...">
                        </div>
                        <div>
                            <label class="form-label">Live Demo Link</label>
                            <input type="url" id="projectLive" class="form-control" placeholder="https://...">
                        </div>
                    </div>
                    <div class="mt-4 flex gap-3">
                        <button type="submit" class="btn btn-primary">Save Project</button>
                        <button type="button" onclick="hideAddProjectForm()" class="btn btn-outline">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Add Blog Form (Hidden by default) -->
            <div id="addBlogForm" class="bg-white rounded-2xl border border-gray-100 p-6 mb-8 hidden">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-gray-800">Add New Blog Post</h3>
                    <button onclick="hideAddBlogForm()" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times text-xl"></i>
                    </button>
                </div>
                <form id="blogForm">
                    <div class="grid md:grid-cols-2 gap-4">
                        <div class="md:col-span-2">
                            <label class="form-label">Blog Title *</label>
                            <input type="text" id="blogTitle" class="form-control" placeholder="e.g., My Journey to Full Stack Development" required>
                        </div>
                        <div class="md:col-span-2">
                            <label class="form-label">Excerpt / Short Description *</label>
                            <textarea id="blogExcerpt" rows="2" class="form-control" placeholder="Brief summary of the blog post" required></textarea>
                        </div>
                        <div class="md:col-span-2">
                            <label class="form-label">Content *</label>
                            <textarea id="blogContent" rows="5" class="form-control" placeholder="Full blog post content"></textarea>
                        </div>
                        <div>
                            <label class="form-label">Read Time (minutes)</label>
                            <input type="number" id="blogReadTime" class="form-control" placeholder="5">
                        </div>
                        <div>
                            <label class="form-label">Tags (comma separated)</label>
                            <input type="text" id="blogTags" class="form-control" placeholder="e.g., JavaScript, React, MongoDB">
                        </div>
                    </div>
                    <div class="mt-4 flex gap-3">
                        <button type="submit" class="btn btn-primary">Save Blog Post</button>
                        <button type="button" onclick="hideAddBlogForm()" class="btn btn-outline">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Projects List -->
            <div class="bg-white rounded-2xl border border-gray-100 overflow-hidden mb-8">
                <div class="border-b border-gray-100 p-4 bg-gray-50">
                    <h3 class="font-bold text-gray-800">My Projects</h3>
                </div>
                <div id="projectsList" class="divide-y divide-gray-100">
                    <div class="p-8 text-center text-gray-500">
                        <i class="fas fa-spinner fa-spin mr-2"></i> Loading projects...
                    </div>
                </div>
            </div>

            <!-- Blog Posts List -->
            <div class="bg-white rounded-2xl border border-gray-100 overflow-hidden">
                <div class="border-b border-gray-100 p-4 bg-gray-50">
                    <h3 class="font-bold text-gray-800">Blog Posts</h3>
                </div>
                <div id="blogList" class="divide-y divide-gray-100">
                    <div class="p-8 text-center text-gray-500">
                        <i class="fas fa-spinner fa-spin mr-2"></i> Loading blog posts...
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container-custom">
            <p>&copy; 2024 Mohammed Shoaib S - Junior Frontend Developer</p>
        </div>
    </footer>

    <script type="module" src="../js/app.js"></script>
    
    <script>
        // Sample data (replace with actual API calls)
        let projects = [
            { id: 1, title: "Alumni Portal", tech: ["HTML5", "CSS3", "JavaScript", "MySQL"], description: "CRUD web application for student admission records, fee tracking, and document verification." },
            { id: 2, title: "Admission Management System", tech: ["HTML/CSS", "PHP", "MySQL", "CRUD"], description: "Full-stack CRUD web app for digitizing student admissions." },
            { id: 3, title: "Premium Calculator Pro", tech: ["Vanilla JS", "CSS Flexbox", "CSS Grid", "Netlify"], description: "Responsive calculator with calculation history using Vanilla JS." }
        ];

        let blogPosts = [
            { id: 1, title: "My Journey to Full Stack Developer", excerpt: "Starting from zero coding knowledge to building full-stack applications.", readTime: 5 },
            { id: 2, title: "Understanding MongoDB", excerpt: "Learn the basics of MongoDB and how it differs from SQL databases.", readTime: 4 }
        ];

        // Load data on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadProjects();
            loadBlogs();
            updateStats();
        });

        function loadProjects() {
            const container = document.getElementById('projectsList');
            if (projects.length === 0) {
                container.innerHTML = '<div class="p-8 text-center text-gray-500">No projects yet. Click "Add Project" to create one.</div>';
                return;
            }
            
            container.innerHTML = projects.map(project => `
                <div class="p-4 hover:bg-gray-50 transition">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h4 class="font-semibold text-gray-800">${project.title}</h4>
                            <div class="flex flex-wrap gap-1 mt-1">
                                ${project.tech.map(t => `<span class="tech-tag text-xs">${t}</span>`).join('')}
                            </div>
                            <p class="text-sm text-gray-500 mt-1">${project.description.substring(0, 100)}...</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editProject(${project.id})" class="text-blue-500 hover:text-blue-700">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteProject(${project.id})" class="text-red-500 hover:text-red-700">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function loadBlogs() {
            const container = document.getElementById('blogList');
            if (blogPosts.length === 0) {
                container.innerHTML = '<div class="p-8 text-center text-gray-500">No blog posts yet. Click "Add Blog Post" to create one.</div>';
                return;
            }
            
            container.innerHTML = blogPosts.map(post => `
                <div class="p-4 hover:bg-gray-50 transition">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h4 class="font-semibold text-gray-800">${post.title}</h4>
                            <p class="text-sm text-gray-500 mt-1">${post.excerpt.substring(0, 100)}...</p>
                            <span class="text-xs text-gray-400 mt-1 inline-block">${post.readTime} min read</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editBlog(${post.id})" class="text-blue-500 hover:text-blue-700">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteBlog(${post.id})" class="text-red-500 hover:text-red-700">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('totalProjects').innerText = projects.length;
            document.getElementById('totalBlogs').innerText = blogPosts.length;
            document.getElementById('totalViews').innerText = '1,234';
            document.getElementById('totalMessages').innerText = '5';
        }

        // Form functions
        function showAddProjectForm() {
            document.getElementById('addProjectForm').classList.remove('hidden');
        }

        function hideAddProjectForm() {
            document.getElementById('addProjectForm').classList.add('hidden');
            document.getElementById('projectForm').reset();
        }

        function showAddBlogForm() {
            document.getElementById('addBlogForm').classList.remove('hidden');
        }

        function hideAddBlogForm() {
            document.getElementById('addBlogForm').classList.add('hidden');
            document.getElementById('blogForm').reset();
        }

        // Project Form Submit
        document.getElementById('projectForm')?.addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('projectTitle').value;
            const tech = document.getElementById('projectTech').value.split(',').map(t => t.trim());
            const description = document.getElementById('projectDesc').value;
            
            const newProject = {
                id: projects.length + 1,
                title: title,
                tech: tech,
                description: description
            };
            
            projects.push(newProject);
            loadProjects();
            updateStats();
            hideAddProjectForm();
            alert('Project added successfully!');
        });

        // Blog Form Submit
        document.getElementById('blogForm')?.addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('blogTitle').value;
            const excerpt = document.getElementById('blogExcerpt').value;
            const readTime = parseInt(document.getElementById('blogReadTime').value) || 5;
            
            const newBlog = {
                id: blogPosts.length + 1,
                title: title,
                excerpt: excerpt,
                readTime: readTime
            };
            
            blogPosts.push(newBlog);
            loadBlogs();
            updateStats();
            hideAddBlogForm();
            alert('Blog post added successfully!');
        });

        // Delete functions
        function deleteProject(id) {
            if (confirm('Are you sure you want to delete this project?')) {
                projects = projects.filter(p => p.id !== id);
                loadProjects();
                updateStats();
                alert('Project deleted!');
            }
        }

        function deleteBlog(id) {
            if (confirm('Are you sure you want to delete this blog post?')) {
                blogPosts = blogPosts.filter(b => b.id !== id);
                loadBlogs();
                updateStats();
                alert('Blog post deleted!');
            }
        }

        function editProject(id) {
            alert('Edit feature coming soon!');
        }

        function editBlog(id) {
            alert('Edit feature coming soon!');
        }
    </script>
</body>
</html>
